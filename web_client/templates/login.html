<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CernCloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0070F3;
            --text-main: #111827;
            --text-muted: #6B7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Mesh Gradient Background */
            background-color: #000000;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-size: 150% 150%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Glassmorphism Card */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(0, 112, 243, 0.5));
        }

        .brand-title {
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #0060DF;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 112, 243, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 32px 20px;
                max-width: 100%;
                box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
            }

            .brand-title {
                font-size: 1.75rem;
            }

            .brand-subtitle {
                font-size: 0.85rem;
            }

            .form-input {
                padding: 12px 16px;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 14px;
                font-size: 0.95rem;
            }

            .footer-text {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
                border-radius: 16px;
            }

            .brand-title {
                font-size: 1.5rem;
            }

            .form-input {
                background: rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">☁️</div>
            <h1 class="brand-title">CernCloud</h1>
            <p style="color: rgba(255,255,255,0.5); margin-top: 8px;">Accédez à votre espace sécurisé</p>
        </div>

        {% if error %}
        <div class="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            <div class="form-group">
                <label class="form-label">Identifiant</label>
                <input type="text" name="username" class="form-control form-input" placeholder="Votre nom d'utilisateur"
                    required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">
                Se connecter
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: rgba(255,255,255,0.3);">
            &copy; 2025 CernCloud Systems
        </div>
    </div>
</body>

</html>
