services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: nas_ldap
    environment:
      LDAP_ORGANISATION: "NAS Company"
      LDAP_DOMAIN: "nas.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: "/ldif"
    ports:
      - "389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap_bootstrap:/ldif
    networks:
      - nas_network
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=nas,dc=local -D cn=admin,dc=nas,dc=local -w admin || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: nas_server
    environment:
      ADMIN_USERNAME: admin
    ports:
      - "65432:65432"
    volumes:
      - ./storage:/app/storage
      - ./user_keys:/app/user_keys:ro
    networks:
      - nas_network
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    container_name: nas_client
    environment:
      FLASK_PORT: "5000"
      FLASK_SECRET_KEY: "change-me-in-production"
      ADMIN_USERNAME: "admin"
      FLASK_USE_MOCK_LDAP: "False"
      FLASK_LDAP_HOST: "ldap://ldap:389"
      FLASK_LDAP_BASE_DN: "dc=nas,dc=local"
      FLASK_LDAP_USER_DN: "ou=users"
      FLASK_LDAP_USER_RDN_ATTR: "uid"
      FLASK_LDAP_USER_SEARCH_FILTER: "(uid={username})"
      FLASK_LDAP_USER_LOGIN_ATTR: "uid"
      FLASK_LDAP_BIND_USER_DN: "cn=admin,dc=nas,dc=local"
      FLASK_LDAP_BIND_USER_PASSWORD: "admin"
      FLASK_LDAP_USE_SSL: "False"
      FLASK_LDAP_PORT: "389"
      STORAGE_SERVER_IP: "server"
      STORAGE_SERVER_PORT: "65432"
      UPLOAD_FOLDER: "temp_uploads"
      DOWNLOAD_FOLDER: "temp_downloads"
    ports:
      - "5000:5000"
    volumes:
      - ./user_keys:/app/user_keys
      - ./storage:/app/storage
      - ./temp_uploads:/app/temp_uploads
      - ./temp_downloads:/app/temp_downloads
    depends_on:
      ldap:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - nas_network
    restart: unless-stopped

networks:
  nas_network:
    driver: bridge

volumes:
  ldap_data:
  ldap_config:
