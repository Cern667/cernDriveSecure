services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: nas_ldap
    platform: linux/amd64
    environment:
      LDAP_ORGANISATION: "${LDAP_ORGANISATION:-NAS Company}"
      LDAP_DOMAIN: "${LDAP_DOMAIN:-nas.local}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-admin}"
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - nas_network
    healthcheck:
      test: [ "CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=nas,dc=local -D cn=admin,dc=nas,dc=local -w ${LDAP_ADMIN_PASSWORD:-admin} || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  ldap-init:
    image: osixia/openldap:1.5.0
    platform: linux/amd64
    container_name: nas_ldap_init
    environment:
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-admin}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=nas,dc=local}"
    volumes:
      - ./ldap_bootstrap:/ldap_bootstrap:ro
    networks:
      - nas_network
    depends_on:
      ldap:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Vérifier si les utilisateurs existent déjà
        if ldapsearch -x -H ldap://ldap:389 -b "ou=users,${LDAP_BASE_DN}" -D "cn=admin,${LDAP_BASE_DN}" -w ${LDAP_ADMIN_PASSWORD} >/dev/null 2>&1; then
          echo "✓ Les utilisateurs existent déjà dans LDAP"
          exit 0
        fi
        echo "Importation des utilisateurs LDAP..."
        tail -n +2 /ldap_bootstrap/01-users.ldif | ldapadd -x -H ldap://ldap:389 -D "cn=admin,${LDAP_BASE_DN}" -w ${LDAP_ADMIN_PASSWORD}
        if [ $$? -eq 0 ]; then
          echo "✓ Utilisateurs LDAP importés avec succès"
        else
          echo "✗ Erreur lors de l'import"
          exit 1
        fi
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: nas_server
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
    ports:
      - "65432:65432"
    volumes:
      - ./storage:/app/storage
      - ./user_keys:/app/user_keys:ro
    networks:
      - nas_network
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    container_name: nas_client
    environment:
      FLASK_PORT: "5000"
      FLASK_SECRET_KEY: "${SECRET_KEY}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      FLASK_USE_MOCK_LDAP: "False"

      # ---------------- LDAP CONFIG ----------------
      FLASK_LDAP_HOST: "ldap://ldap:389"
      FLASK_LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=nas,dc=local}"
      FLASK_LDAP_USER_DN: "ou=users"
      FLASK_LDAP_USER_RDN_ATTR: "uid"
      FLASK_LDAP_USER_SEARCH_FILTER: "(uid={username})"
      FLASK_LDAP_USER_LOGIN_ATTR: "uid"
      FLASK_LDAP_BIND_USER_DN: "cn=admin,${LDAP_BASE_DN:-dc=nas,dc=local}"
      FLASK_LDAP_BIND_USER_PASSWORD: "${LDAP_ADMIN_PASSWORD:-admin}"
      FLASK_LDAP_USE_SSL: "False"
      FLASK_LDAP_PORT: "389"
      # -------------------------------------------------

      STORAGE_SERVER_IP: "server"
      STORAGE_SERVER_PORT: "65432"
      UPLOAD_FOLDER: "temp_uploads"
      DOWNLOAD_FOLDER: "temp_downloads"
    ports:
      - "5000:5000"
    volumes:
      - ./user_keys:/app/user_keys
      - ./storage:/app/storage
      - ./temp_uploads:/app/temp_uploads
      - ./temp_downloads:/app/temp_downloads
    depends_on:
      ldap:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
      server:
        condition: service_started
    networks:
      - nas_network
    restart: unless-stopped

networks:
  nas_network:
    driver: bridge

volumes:
  ldap_data:
  ldap_config:
