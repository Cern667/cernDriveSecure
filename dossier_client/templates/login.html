<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion au NAS</title>
    <style>
        :root {
            --bg: #0f0b1f;
            --card: #161233;
            --text: #e5e7eb;
            --muted: #a1a1aa;
            --primary: #8b5cf6; /* violet */
            --primary-hover: #7c3aed;
            --danger: #ef4444;
        }
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 8vh auto; background-color: var(--bg); color: var(--text); }
        .brand { text-align:center; color: var(--primary); margin-bottom: 18px; font-weight: 700; letter-spacing: .5px; }
        .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
        h1 { margin-top: 0; font-size: 22px; }
        label { display: block; margin: 14px 0 8px; }
        input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b2552; background: #1b173b; color: var(--text); }
        button { width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--primary-hover); }
        .error { margin-top: 12px; padding: 10px; border-radius: 8px; background: #3a0f0f; color: #ffb3b3; border: 1px solid #5b1a1a; }
        .hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔐</text></svg>">
</head>
<body>
    <div class="brand">NAS Dashboard</div>
    <div class="card">
        <h1>Connexion</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">
            <label for="username">Nom d'utilisateur</label>
            <input id="username" name="username" type="text" required autocomplete="username" />

            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" />

            <button type="submit">Se connecter</button>
        </form>

        <p class="hint">Chaque utilisateur LDAP a son espace dédié sur le NAS.</p>
    </div>
</body>
</html>
