<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Uploader vers le NAS</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2em auto; background-color: #f4f4f4; }
        .container { background-color: white; padding: 2em; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        input[type="file"] { border: 1px solid #ccc; padding: 10px; width: 100%; border-radius: 4px; box-sizing: border-box; }
        button, .nav-button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 1em;
            text-align: center;
            text-decoration: none; /* Pour les liens stylisés en bouton */
            box-sizing: border-box;
        }
        button { background-color: #007BFF; color: white; }
        button:hover { background-color: #0056b3; }

        /* Style spécifique pour le bouton/lien de navigation */
        .nav-button {
            background-color: #28a745; /* Vert pour la restauration */
            color: white;
        }
        .nav-button:hover {
            background-color: #218838;
        }

        .message { padding: 1em; margin-top: 1.5em; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Envoyer des Fichiers vers le Serveur</h1>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <p>
                <label for="files">Choisissez un ou plusieurs fichiers :</label><br><br>
                <input type="file" id="files" name="files_to_upload" multiple required>
            </p>
            <button type="submit">Envoyer les Fichiers</button>
        </form>

        <!-- Voici le lien correct, stylisé comme un bouton, qui mène vers /restore -->
        <a href="/restore" class="nav-button">Gérer et Restaurer les Fichiers</a>

        <!-- Ce bloc affichera les messages de succès ou d'erreur -->
        {% if message %}
            <div class="message {{ 'success' if 'Succès' in message else 'error' }}">
                <strong>{{ message }}</strong>
            </div>
        {% endif %}

    </div>
</body>
</html>
