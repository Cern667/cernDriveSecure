<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Restaurer un Fichier</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 700px; margin: 3em auto; background-color: #f0f2f5; }
        .container { background-color: #ffffff; padding: 2em; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h1 { color: #1c1e21; }
        ul { list-style-type: none; padding: 0; }
        li { background-color: #f7f7f7; padding: 1em; border-radius: 5px; margin-bottom: 0.5em; display: flex; justify-content: space-between; align-items: center; }
        a.download-link { background-color: #28a745; color: white; padding: 0.5em 1em; text-decoration: none; border-radius: 4px; }
        a.download-link:hover { background-color: #218838; }
        a.nav-link { display: inline-block; margin-top: 1.5em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fichiers Disponibles sur le Serveur</h1>

        {% if files %}
            <ul>
                {% for file in files %}
                    <li>
                        <span>{{ file }}</span>
                        <a href="{{ url_for('download_file', filename=file) }}" class="download-link">Télécharger</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Aucun fichier trouvé sur le serveur de stockage.</p>
        {% endif %}

        <a href="{{ url_for('index') }}" class="nav-link">Retour à la page d'envoi</a>
    </div>
</body>
</html>
