<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cle privee requise - NAS Securise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
        .info-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 13px;
            color: #aaa;
        }
        .file-input-wrapper {
            position: relative;
            margin: 20px 0;
        }
        .file-input {
            display: none;
        }
        .file-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-label:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        .file-label.has-file {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        .file-name {
            margin-top: 10px;
            font-size: 12px;
            color: #10b981;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            margin: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #888;
        }
        .result { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
        .result.show { display: block; }
        .result.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        .spinner.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔑</div>
        <h1>Cle privee requise</h1>
        <p class="subtitle">Pour dechiffrer vos fichiers, uploadez votre cle privee.</p>

        <div class="info-box">
            <strong>Fichier demande :</strong> {{ filename }}<br><br>
            Votre cle privee est necessaire pour dechiffrer ce fichier.
            Elle ne sera utilisee que temporairement et ne sera pas conservee sur le serveur apres cette session.
        </div>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="file-input-wrapper">
                <input type="file" id="privateKey" name="private_key" class="file-input" accept=".pem">
                <label for="privateKey" class="file-label" id="fileLabel">
                    📁 Cliquez pour selectionner votre fichier private_key.pem
                    <div class="file-name" id="fileName"></div>
                </label>
            </div>

            <div class="spinner" id="spinner"></div>
            <div class="result" id="result"></div>

            <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                Dechiffrer le fichier
            </button>
            <a href="/" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('privateKey');
        const fileLabel = document.getElementById('fileLabel');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('uploadForm');
        const spinner = document.getElementById('spinner');
        const result = document.getElementById('result');

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
                fileLabel.classList.add('has-file');
                submitBtn.disabled = false;
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            spinner.classList.add('active');
            result.classList.remove('show');

            const formData = new FormData();
            formData.append('private_key', fileInput.files[0]);

            try {
                const response = await fetch('/upload-private-key', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                spinner.classList.remove('active');

                if (data.success) {
                    // Rediriger vers le download
                    window.location.href = '{{ redirect_url | safe }}';
                } else {
                    result.textContent = 'Erreur: ' + data.error;
                    result.classList.add('show', 'error');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                spinner.classList.remove('active');
                result.textContent = 'Erreur: ' + err.message;
                result.classList.add('show', 'error');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
